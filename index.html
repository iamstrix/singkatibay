<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SingkaTibay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9DDF0; --panel:rgba(255,255,255,.9); --ink:#2A2233; --ink-2:#5E5468; --line:rgba(42,34,51,.14);
  --chip:#FFFFFF; --chip-on:#2A2233; --chip-on-ink:#FFFFFF; --p1:#E63946; --p2:#1D4ED8; --gold:#FFD166;
  --good:#1F8A4C; --warn:#B4231B; --mid:#A15C00; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1522; --panel:rgba(30,24,40,.92); --ink:#F3EEF7; --ink-2:#B9AEC6; --line:rgba(255,255,255,.14);
    --chip:#2E2639; --chip-on:#F3EEF7; --chip-on-ink:#1A1522; --p1:#FF6B74; --p2:#7AA2FF; --gold:#FFD166;
    --good:#5ED38F; --warn:#FF8A80; --mid:#F2B25C; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1522; --panel:rgba(30,24,40,.92); --ink:#F3EEF7; --ink-2:#B9AEC6; --line:rgba(255,255,255,.14);
  --chip:#2E2639; --chip-on:#F3EEF7; --chip-on-ink:#1A1522; --p1:#FF6B74; --p2:#7AA2FF; --gold:#FFD166;
  --good:#5ED38F; --warn:#FF8A80; --mid:#F2B25C; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
*,*::before,*::after{box-sizing:inherit}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#sky,#stage{position:fixed;inset:0}
#sky{z-index:0;transition:background 1s}
#stage{z-index:1;display:block;width:100%;height:100%;touch-action:none}

.hud{position:fixed;z-index:3;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none}
.hud > *{pointer-events:auto}
.brand{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.brand b{font-weight:800;font-size:18px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:13px;color:var(--ink-2)}
.timer{display:none;background:var(--gold);color:#2A2233;border-radius:14px;padding:8px 14px;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;min-width:74px;text-align:center}
.timer.low{background:#E63946;color:#fff}
.hudR{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.opp{display:none;align-items:flex-start;gap:8px;max-width:min(240px,56vw);padding:6px 10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);font-size:13px;line-height:1.35;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.opp.on{display:flex}
.opp .dot{width:10px;height:10px;margin-top:4px}
.opp b{overflow-wrap:anywhere}
.opp small{display:block;font-size:12px;color:var(--ink-2)}
.opp.locked{background:var(--gold);color:#2A2233;border-color:transparent;animation:pop .35s ease-out}
.opp.locked small{color:#5E5468}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@media (prefers-reduced-motion: reduce){.opp.locked{animation:none}}

.panel{position:fixed;z-index:3;top:calc(76px + env(safe-area-inset-top,0px));right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:390px;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow-y:auto;overscroll-behavior:contain;padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none}
.panel.on{display:block}
@media (max-width:820px){
  .panel{top:auto;left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:56vh;padding:14px}
}
.who{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
h2{margin:0;font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
h3{margin:18px 0 8px;font-size:16px;font-weight:800}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.pondo{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--chip);border:1px solid var(--line)}
.pondo b{font-size:20px;font-variant-numeric:tabular-nums}
.types{display:grid;gap:8px}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:10px 12px;cursor:pointer}
.card[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.card .row{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.card .row span{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.card p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;margin-top:10px;font-size:13px}
.bar{display:flex;gap:3px}
.bar i{display:block;height:8px;flex:1;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--ink)}
.gridwrap{display:flex;gap:10px;align-items:stretch}
.lot{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;flex:1;max-width:240px;aspect-ratio:1}
.lot button{border:0;border-radius:5px;cursor:pointer;padding:0;position:relative}
.t-solid{background:#A8D58A}
.t-liq{background:repeating-linear-gradient(45deg,#F06A4A 0 5px,#FFE2C8 5px 10px)}
.t-low{background:repeating-linear-gradient(-45deg,#3B82C4 0 5px,#CFE6F7 5px 10px)}
.lot button.fp{outline:3px solid var(--ink);outline-offset:-3px}
.lot button.fp::after{content:"";position:absolute;inset:30%;border-radius:50%;background:var(--ink)}
.lot button.pv{outline:3px dashed var(--ink);outline-offset:-3px}
.border{writing-mode:vertical-rl;font-size:12px;color:var(--ink-2);border:2px dashed var(--ink-2);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px 2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
.retros{display:grid;gap:6px}
.retro{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:8px 10px;cursor:pointer}
.retro[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.retro:disabled{opacity:.45;cursor:not-allowed}
.retro .box{flex:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--ink-2);margin-top:2px}
.retro[aria-pressed="true"] .box{background:var(--ink);border-color:var(--ink)}
.retro b{font-weight:700}
.retro small{display:block;color:var(--ink-2);font-size:12.5px;line-height:1.35}
.retro .cost{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.res{display:grid;gap:8px}
.res .name{font-weight:700;font-size:14px;margin-bottom:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:7px 4px;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
.hint{font-size:12.5px;color:var(--ink-2);margin:6px 0 0}
.lock{position:sticky;bottom:-16px;margin:16px -16px -16px;padding:12px 16px 16px;background:var(--panel);border-top:1px solid var(--line)}
@media (max-width:820px){.lock{bottom:-14px;margin:14px -14px -14px;padding:10px 14px 14px}}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;cursor:pointer;background:var(--ink);color:var(--bg)}
.btn.p1{background:#E63946;color:#fff}
.btn.p2{background:#1D4ED8;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:700}

.overlay{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(26,21,34,.35)}
.overlay.on{display:flex}
.overlay.solid{background:var(--bg)}
.sheet{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sheet h1{margin:0;font-size:clamp(38px,11vw,56px);line-height:1;font-weight:800;letter-spacing:-.03em}
.sheet .lede{font-size:17px;margin:10px 0 0;max-width:46ch}
.sheet ol{margin:14px 0 18px;padding-left:20px;color:var(--ink-2)}
.sheet ol li{margin:4px 0}
.advisory{margin:14px 0 18px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.advisory .top{padding:10px 14px;color:#fff;font-weight:700;font-size:14px}
.advisory .body{padding:12px 14px;background:var(--chip)}
.advisory .body b{display:block;font-size:22px;line-height:1.2;font-weight:800}
.advisory .body span{color:var(--ink-2);font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

#intro{position:fixed;z-index:5;left:0;right:0;bottom:0;padding:0 20px calc(28px + env(safe-area-inset-bottom,0px));display:none;cursor:pointer;color:#fff;text-shadow:0 3px 0 #2A2233,0 0 24px rgba(0,0,0,.35)}
#intro.on{display:block}
#intro p{margin:0;font-weight:700;font-size:16px}
#intro b{display:block;font-size:clamp(44px,9vw,92px);line-height:.95;font-weight:800;letter-spacing:-.03em;margin-top:4px}
#intro span{display:block;font-size:clamp(16px,2.6vw,22px);font-weight:600;margin-top:8px}
#intro small{display:inline-block;margin-top:14px;font-size:13px;font-weight:700;background:rgba(42,34,51,.55);padding:5px 10px;border-radius:999px;text-shadow:none}
#callout{position:fixed;z-index:5;left:0;right:0;top:18%;text-align:center;pointer-events:none;opacity:0;transition:opacity .3s}
#callout.on{opacity:1}
#callout b{display:block;font-size:clamp(56px,13vw,136px);line-height:.95;font-weight:800;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 0 #2A2233,0 0 30px rgba(0,0,0,.35)}
#callout span{display:inline-block;margin-top:10px;background:#FFD166;color:#2A2233;font-weight:800;padding:6px 14px;border-radius:999px;font-size:18px}

.versus{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
@media (max-width:420px){.versus{grid-template-columns:1fr}}
.pcard{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--chip)}
.pcard .head{display:flex;align-items:center;gap:8px;font-weight:800}
.pcard .score{font-size:30px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.pcard .score small{font-size:13px;color:var(--ink-2);font-weight:600}
.pcard ul{margin:6px 0 0;padding-left:16px;font-size:13px}
.pcard li{margin:2px 0}
.st-ligtas{color:var(--good);font-weight:700}
.st-sugatan{color:var(--mid);font-weight:700}
.st-natrap{color:var(--warn);font-weight:700}
.winner{margin-top:12px;padding:10px 12px;border-radius:12px;font-weight:800;text-align:center;font-size:17px}
.why{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.why li{margin:4px 0}
.err{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;background:var(--bg);font-size:16px}
.code{margin:8px 0 0;text-align:center;font-size:clamp(36px,11vw,52px);font-weight:800;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.qr{width:200px;margin:12px auto 0;padding:10px;border-radius:14px;background:#fff}
.qr svg{display:block;width:100%;height:auto}
.note{margin:8px 0 0;text-align:center;font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.note.bad{color:var(--warn);font-weight:700}
.field{display:block;margin:14px 0 0}
.field span{display:block;margin-bottom:4px;font-size:13px;color:var(--ink-2)}
.field input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink);font:inherit;font-size:18px}
.field input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.field input.codein{text-align:center;text-transform:uppercase;letter-spacing:.2em;font-weight:800}
.field input:disabled{opacity:.6}
.players{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:6px}
.players li{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--chip)}
.players .pn{flex:1;font-weight:700;overflow-wrap:anywhere}
.players .st{font-size:13px;font-weight:700;color:var(--ink-2)}
.players li.is-ready{border-color:var(--good)}
.players li.is-ready .st{color:var(--good)}
.cue{margin:12px 0;min-height:1.45em;text-align:center;font-size:14px;color:var(--ink-2)}
.cue.on{padding:8px 12px;border-radius:12px;background:var(--gold);color:#2A2233}
.lock .cue{margin:0 0 10px}
.cue:empty{display:none}
.btn:disabled{opacity:.6;cursor:default}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,209,102,.9)}50%{box-shadow:0 0 0 6px rgba(255,209,102,0)}}
.btn.pulse{animation:pulse 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.btn.pulse{animation:none;outline:3px solid var(--gold);outline-offset:2px}}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="stage" aria-label="Two floating island lots side by side with an evacuation center between them"></canvas>
<div class="hud">
  <div class="brand"><b>SingkaTibay</b><span id="hudInfo">Disaster-ready build battle</span></div>
  <div class="hudR">
    <div class="timer" id="timer" aria-live="off">60</div>
    <div class="opp" id="oppChip" aria-live="polite"></div>
  </div>
</div>
<div id="intro" role="button" tabindex="0" aria-label="Skip the location flyover"><p id="introRound"></p><b id="introName"></b><span id="introSub"></span><small>Tap to skip</small></div>
<div id="callout" aria-live="assertive"><b id="calloutBig"></b><span id="calloutSub"></span></div>
<aside class="panel" id="panel" aria-live="polite"></aside>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="err" id="err">The 3D view could not start. WebGL may be turned off in this browser.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="config.js"></script>
<script src="online.js"></script>
<script>
(function(){
if(!window.THREE){document.getElementById('err').style.display='flex';return;}
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- Game data ---------------- */
const BUDGET = 40, BUILD_SECONDS = 60, EVAC_SLOTS = 4;
const ROUNDS = ['baha','lindol','bagyo'];
const HZ = {
  baha:{name:'Baha',en:'Flood',place:'Marikina riverside',agency:'PAGASA heavy rainfall warning',color:'#C0533F',call:'Baha!',note:'The Marikina River is rising. Striped blue tiles are low ground that floods first.'},
  lindol:{name:'Lindol',en:'Earthquake',place:'Marikina Valley, along the West Valley Fault',agency:'PHIVOLCS earthquake advisory',color:'#8C4B2F',call:'Lindol!',note:'Striped orange tiles are liquefaction-prone ground that can turn soft when the shaking starts.'},
  bagyo:{name:'Bagyo',en:'Typhoon',place:'the coast of Baler, Aurora',agency:'PAGASA tropical cyclone wind signal',color:'#3A5BA8',call:'Bagyo!',note:'Storm surge is expected along the shore. Striped blue tiles near the sea flood first.'}
};
const TEMPLATES = {
  kubo:{name:'Bahay kubo',cost:0,W:2,Cq:2,Cw:2,floodRes:.3,floorLevel:1,storeys:1,roof:'nipa',wall:'bamboo',
    desc:'Light bamboo house already on stilts. Cheap, but strong wind can tear it apart.'},
  chb:{name:'Hollow-block house',cost:5,W:6,Cq:4,Cw:5,floodRes:.7,floorLevel:0,storeys:2,roof:'gi',wall:'chb',
    desc:'The most common modern house. Often under-reinforced for earthquakes.'},
  bato:{name:'Bahay na bato',cost:15,W:7,Cq:7,Cw:7,floodRes:.9,floorLevel:0,storeys:2,roof:'tile',wall:'stone',
    desc:'Stone below, wood above. Tough all-round, but heavy and expensive.'}
};
const RETRO = [
  {id:'brace',name:'Cross-bracing',cost:8,desc:'Stiffens the frame against shaking. Also steadies stilts.'},
  {id:'posts',name:'Extra haligi posts',cost:6,desc:'More posts carrying the load.'},
  {id:'columns',name:'Concrete columns',cost:10,only:['chb'],desc:'Reinforced corners for hollow-block walls. A bit heavier.'},
  {id:'mat',name:'Mat foundation',cost:12,desc:'One wide slab under the house, so it doesn’t sink into weak ground.'},
  {id:'stilts',name:'Raise on stilts',cost:10,not:['kubo'],desc:'Lifts every floor one level. Wobbly in earthquakes unless braced.'},
  {id:'nipa',name:'Light nipa roof',cost:5,not:['kubo'],desc:'Much lighter roof, but it catches more wind.'},
  {id:'stone',name:'Stone lower walls',cost:8,not:['bato'],desc:'Ground floor holds up in floods. Adds weight.'},
  {id:'straps',name:'Roof straps',cost:6,desc:'Ties the roof down against wind. Bamboo can only be strapped so far.'}
];
const RESIDENTS = ['Lola Ising','Mang Ben','Bunso'];
const ACTIONS = [['evac','Lumikas'],['dch','Duck, Cover, Hold'],['up','Akyat']];
const STATUS = {ligtas:['Ligtas','safe',100],sugatan:['Sugatan','injured',40],natrap:['Na-trap','trapped, rescued later',20]};
const ROMAN = {6:'VI',7:'VII',8:'VIII',9:'IX'};
const RAIN_NAME = {1:'Orange',2:'Red'};

/* ---------------- RNG and terrain ---------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeTerrain(hz,rng){
  for(let attempt=0;attempt<40;attempt++){
    const T = [...Array(5)].map(()=>Array(5).fill('solid'));
    const blob=(type,n,startRows)=>{
      let c,r,tries=0;
      do{c=Math.floor(rng()*5);r=startRows?startRows[Math.floor(rng()*startRows.length)]:Math.floor(rng()*5);tries++;}
      while(T[c][r]!=='solid'&&tries<30);
      T[c][r]=type; let placed=1, guard=0;
      while(placed<n&&guard<200){
        guard++;
        const cells=[];for(let x=0;x<5;x++)for(let y=0;y<5;y++)if(T[x][y]===type)cells.push([x,y]);
        const [x,y]=cells[Math.floor(rng()*cells.length)];
        const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rng()*4)];
        const nx=x+d[0], ny=y+d[1];
        if(nx>=0&&nx<5&&ny>=0&&ny<5&&T[nx][ny]==='solid'){T[nx][ny]=type;placed++;}
      }
    };
    if(hz==='baha'){ for(let c=0;c<5;c++) if(rng()<.6) T[c][4]='low'; blob('low',4,[3,4]); blob('liq',2); }
    else if(hz==='lindol'){ blob('liq',6); blob('liq',3); blob('low',2); }
    else { for(let c=0;c<5;c++) if(rng()<.55) T[c][4]='low'; blob('low',3,[3,4]); blob('liq',2); }
    let clean=0;
    for(let ax=0;ax<4;ax++)for(let ar=0;ar<4;ar++){
      if(fpTiles({ax,ar}).every(([c,r])=>T[c][r]==='solid')) clean++;
    }
    if(clean>=2&&clean<=7) return T;
  }
  return [...Array(5)].map(()=>Array(5).fill('solid'));
}
function mirror(T){return T.map((_,c)=>T[4-c].slice());}
function fpTiles(a){return [[a.ax,a.ar],[a.ax+1,a.ar],[a.ax,a.ar+1],[a.ax+1,a.ar+1]];}

/* ---------------- State ---------------- */
let G = null;
function newMatch(seed){
  G = {seed, round:0, wins:[0,0], totals:[0,0], history:[]};
  setupRound();
}
function setupRound(){
  const hz = ROUNDS[G.round];
  const rng = mulberry32(G.seed*31 + G.round*977 + 7);
  const T1 = makeTerrain(hz,rng);
  let band, actual;
  if(hz==='lindol'){ const lo = rng()<.5?7:8; band=[lo,lo+1]; actual = lo+(rng()<.5?0:1); }
  else if(hz==='baha'){ band=[1,2]; actual = rng()<.5?1:2; }
  else { const lo = rng()<.5?3:4; band=[lo,lo+1]; actual = lo+(rng()<.5?0:1); }
  G.hz = hz; G.band = band; G.actual = actual;
  G.terrain = [T1, mirror(T1)];
  G.picks = [blankPick(), blankPick()];
  G.result = null;
}
function blankPick(){return {type:null, anchor:null, retro:new Set(), actions:['dch','dch','dch'], left:0, auto:false};}

function stats(p){
  const t = TEMPLATES[p.type]; const s = {W:t.W,Cq:t.Cq,Cw:t.Cw,floodRes:t.floodRes,floorLevel:t.floorLevel,storeys:t.storeys,roof:t.roof,wall:t.wall,mat:false};
  const has = id=>p.retro.has(id);
  if(has('brace')) s.Cq+=3;
  if(has('posts')) s.Cq+=2;
  if(has('columns')){ s.Cq+=3; s.W+=1; }
  if(has('stilts')){ s.floorLevel+=1; if(!has('brace')) s.Cq-=2; }
  if(has('nipa')){ s.W-=2; s.Cw-=1; s.roof='nipa'; }
  if(has('stone')){ s.floodRes=Math.max(s.floodRes,.9); s.W+=2; s.wall='stone'; }
  if(has('straps')) s.Cw+=3;
  if(p.type==='kubo') s.Cw=Math.min(s.Cw,4);
  if(has('mat')) s.mat=true;
  s.Cq=Math.max(1,s.Cq); s.W=Math.max(1,s.W); s.Cw=Math.max(1,s.Cw);
  return s;
}
function spent(p){
  if(!p.type) return 0;
  let n = TEMPLATES[p.type].cost;
  p.retro.forEach(id=>{n += RETRO.find(r=>r.id===id).cost;});
  return n;
}
function retroAllowed(r,type){
  if(!type) return false;
  if(r.only && !r.only.includes(type)) return false;
  if(r.not && r.not.includes(type)) return false;
  return true;
}

/* ---------------- Rules engine ---------------- */
function evaluate(){
  const hz = G.hz, A = G.actual;
  const P = G.picks;
  const atBorder = [P[0].anchor.ax===3, P[1].anchor.ax===0];
  const evacOK=[[],[]], evacFull=[[],[]];
  if(hz!=='lindol'){
    let slots = EVAC_SLOTS;
    // online picks carry the server's lock-in time; pass-and-play falls back to seconds left
    const p2First = P[0].lockT!=null && P[1].lockT!=null ? P[1].lockT < P[0].lockT : P[1].left > P[0].left;
    const order = p2First ? [1,0] : [0,1];
    order.forEach(pi=>P[pi].actions.forEach((a,i)=>{
      if(a==='evac'){ if(slots>0){evacOK[pi][i]=true;slots--;} else evacFull[pi][i]=true; }
    }));
  }
  return [0,1].map(pi=>{
    const p = P[pi], s = stats(p), T = G.terrain[pi];
    const tiles = fpTiles(p.anchor).map(([c,r])=>T[c][r]);
    const onLiq = tiles.includes('liq'), onLow = tiles.includes('low');
    const why = [], viol = [], anim = {};
    let integ = 100;
    const status = [];
    const top = s.floorLevel + s.storeys - 1;

    if(hz==='lindol'){
      const k = {6:.5,7:.75,8:1.0,9:1.3}[A];
      const r = s.W*k/s.Cq;
      if(r<=.7) integ=100;
      else if(r<=1.0) integ = 100-(r-.7)/.3*30;
      else if(r<=1.3) integ = 70-(r-1)/.3*35;
      else integ = 10;
      anim.full = r>1.3; anim.upper = !anim.full && s.storeys>=2 && r>1.15; anim.tilt = r>.7 && !anim.full ? Math.min(.08,(r-.7)*.15) : 0;
      if(anim.full) why.push('The frame couldn’t carry the house’s weight during the shaking, so it collapsed. Bracing, more posts, or a lighter roof spread the load.');
      else if(anim.upper) why.push('The upper floor gave way. Heavy upper floors and roofs need a stiffer frame below them.');
      else if(r>.7) why.push('The house took damage because its weight was close to what its frame could handle.');
      else why.push('Light enough for its frame: the structure rode out the shaking.');
      if(onLiq && !s.mat){ integ-=30; anim.sink=true; viol.push('Built on liquefaction-prone ground without a mat foundation'); why.push('The ground under the house turned soft during the shaking (liquefaction), so it sank and tilted. A wide mat foundation keeps a house from sinking.'); }
      if(atBorder[0]&&atBorder[1]&&Math.abs(P[0].anchor.ar-P[1].anchor.ar)<=1){ integ-=10; anim.pound=true; viol.push('No gap at the shared border'); why.push('Both houses were built right on the shared border and slammed into each other. Neighboring buildings need space between them.'); }
      p.actions.forEach(a=>{
        if(a==='evac') status.push('sugatan');
        else if(a==='dch') status.push(anim.full?'natrap':'ligtas');
        else status.push(s.storeys>=2 ? ((anim.full||anim.upper)?'natrap':'sugatan') : (anim.full?'natrap':'ligtas'));
      });
      if(p.actions.includes('evac')) why.push('Running outside while the ground is shaking causes injuries. Duck, Cover, and Hold first, then evacuate once the shaking stops.');
      if(p.actions.includes('up') && s.storeys>=2) why.push('Climbing stairs mid-earthquake is dangerous. Stay put and protect yourself where you are.');
    }
    else if(hz==='baha'){
      const h = A + (onLow?1:0);
      const sub = Math.max(0,Math.min(h - s.floorLevel, s.storeys));
      integ = 100 - sub*(1-s.floodRes)*55;
      if(h > s.floorLevel + s.storeys) integ -= 20;
      anim.water = h;
      if(onLow) why.push('The house sat on low ground, so the water there rose one level higher.');
      if(onLow && s.floorLevel===0) viol.push('Built on low ground without raising the floor');
      if(sub>0 && s.floodRes<.6) why.push('Bamboo walls fall apart in deep water. Stone lower walls hold up much better.');
      if(sub===0) why.push('Every floor stayed above the water.');
      p.actions.forEach((a,i)=>{
        let act=a;
        if(a==='evac'){ if(evacOK[pi][i]){status.push('ligtas');return;} act='dch'; }
        if(act==='dch') status.push(h > s.floorLevel ? 'natrap':'ligtas');
        else status.push(h > top ? 'natrap':'ligtas');
      });
      if(evacFull[pi].some(Boolean)) why.push('The evacuation center was already full. Whoever locks in first gets the spaces, so evacuate early.');
      if(p.actions.some((a,i)=>a!=='evac'&&status[i]==='natrap')) why.push('People stayed on a floor the water reached. Evacuating early, or a higher floor, keeps them out of the water.');
    }
    else {
      const kw = {3:3.5,4:5,5:6.5}[A];
      const rw = kw/s.Cw;
      if(rw<=.7) integ=100; else if(rw<=1) integ=100-(rw-.7)/.3*25; else integ = 50-Math.min(25,(rw-1)*50);
      anim.roofLost = rw>1;
      const h = onLow?1:0; anim.water = h;
      const sub = Math.max(0,Math.min(h - s.floorLevel, s.storeys));
      integ -= sub*(1-s.floodRes)*30;
      if(anim.roofLost){ why.push('The wind tore the roof off. Roof straps and a heavier, anchored roof resist strong wind.'); if(!p.retro.has('straps')) viol.push('Roof not strapped down'); }
      else why.push('The roof stayed on through the wind.');
      if(onLow) why.push('Storm surge from the sea flooded the low ground near the shore.');
      p.actions.forEach((a,i)=>{
        let act=a;
        if(a==='evac'){ if(evacOK[pi][i]){status.push('ligtas');return;} act='dch'; }
        if(act==='dch') status.push(h > s.floorLevel ? 'natrap' : (anim.roofLost && rw>1.4 ? 'sugatan':'ligtas'));
        else status.push(anim.roofLost ? 'sugatan' : (h > top ? 'natrap':'ligtas'));
      });
      if(evacFull[pi].some(Boolean)) why.push('The evacuation center was already full. Whoever locks in first gets the spaces, so evacuate early.');
      if(anim.roofLost && p.actions.includes('up')) why.push('The top floor is the most exposed when a roof fails.');
    }
    integ = Math.max(5,Math.min(100,Math.round(integ)));
    const lives = status.reduce((n,st)=>n+STATUS[st][2],0);
    const lockBonus = Math.floor(p.left/10)*5;
    const leftover = Math.floor((BUDGET-spent(p))*.5);
    const score = lives + integ - viol.length*10 + lockBonus + leftover;
    return {pi, s, integ, status, viol, why:why.slice(0,4), lives, lockBonus, leftover, score, anim, evacOK:evacOK[pi], evacFull:evacFull[pi]};
  });
}

const waterMat = new THREE.MeshToonMaterial({color:'#4FA3E0',gradientMap:gradMap,transparent:true,opacity:.62,depthWrite:false});

const lowWater = [null,null];
function buildLowWater(pi){
  if(lowWater[pi]){ world.remove(lowWater[pi]); lowWater[pi].geometry.dispose(); lowWater[pi]=null; }
  const T = G.terrain[pi], P = [], V = THREE.Vector3;
  const isLow = (c,r)=> c>=0&&c<5&&r>=0&&r<5&&T[c][r]==='low';
  const quad = (a,b,c,d,n)=>{
    const ab=new V().subVectors(b,a), ac=new V().subVectors(c,a);
    const pts = new V().crossVectors(ab,ac).dot(n)<0 ? [a,c,b,a,d,c] : [a,b,c,a,c,d];
    pts.forEach(p=>P.push(p.x,p.y,p.z));
  };
  for(let c=0;c<5;c++) for(let r=0;r<5;r++){
    if(!isLow(c,r)) continue;
    const x0=lotX(pi,c)-.5, x1=x0+1, z0=lotZ(r)-.5, z1=z0+1;
    quad(new V(x0,1,z0),new V(x1,1,z0),new V(x1,1,z1),new V(x0,1,z1),new V(0,1,0));
    if(!isLow(c-1,r)) quad(new V(x0,0,z0),new V(x0,0,z1),new V(x0,1,z1),new V(x0,1,z0),new V(-1,0,0));
    if(!isLow(c+1,r)) quad(new V(x1,0,z0),new V(x1,0,z1),new V(x1,1,z1),new V(x1,1,z0),new V(1,0,0));
    if(!isLow(c,r-1)) quad(new V(x0,0,z0),new V(x1,0,z0),new V(x1,1,z0),new V(x0,1,z0),new V(0,0,-1));
    if(!isLow(c,r+1)) quad(new V(x0,0,z1),new V(x1,0,z1),new V(x1,1,z1),new V(x0,1,z1),new V(0,0,1));
  }
  if(!P.length) return;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  geo.computeVertexNormals();
  const m = new THREE.Mesh(geo,waterMat);
  m.position.y=.5; m.scale.y=.01; m.visible=false; m.renderOrder=3;
  world.add(m); lowWater[pi]=m;
}
function resetWater(){
  [0,1].forEach(buildLowWater);

// the house model for pick p with its 2×2 footprint at anchor a (also used for the hover preview)
function makeHouse(pi,p,a){
  const s = stats(p), type = p.type, has = id=>p.retro.has(id);
  const g = new THREE.Group(), lower = new THREE.Group(), upper = new THREE.Group(), roof = new THREE.Group();
  g.add(lower); g.add(upper); g.add(roof);
  const cx = (lotX(pi,a.ax)+lotX(pi,a.ax+1))/2, cz = (lotZ(a.ar)+lotZ(a.ar+1))/2;
  g.position.set(cx,.5,cz);
  let base = 0;
  if(s.mat){ box(lower,'#A39E95',2.06,.14,2.06,0,.07,0); base=.14; }
  else [[-.8,-.8],[.8,-.8],[-.8,.8],[.8,.8]].forEach(([x,z])=>box(lower,'#8D8478',.32,.12,.32,x,.06,z));
  const H = .9, fl = s.floorLevel;
  if(fl>0){
    const pc = type==='kubo' ? '#B98C4A' : '#7A5241';
    [[-.78,-.78],[.78,-.78],[-.78,.78],[.78,.78]].forEach(([x,z])=>box(lower,pc,.12,fl*H,.12,x,base+fl*H/2,z));
    box(lower,pc,1.92,.08,1.92,0,base+fl*H-.04,0);
    if(has('brace')){ const L=Math.hypot(1.56,fl*H), ang=Math.atan2(fl*H,1.56);
      [-1,1].forEach(sd=>{ box(lower,'#E0A84E',.05,.07,L,sd*.8,base+fl*H/2,0,{rx:ang}); box(lower,'#E0A84E',.05,.07,L,sd*.8,base+fl*H/2,0,{rx:-ang}); }); }
  }
  for(let i=0;i<s.storeys;i++){
    const y = base + (fl+i)*H, tgt = i===0 ? lower : upper;
    let col = '#BFC3C9';
    if(type==='kubo') col='#D8B26E';
    if(type==='bato') col = i===0 ? '#C9BCA6' : '#9A6A45';
    if(type==='chb') col = '#C2C6CC';
    if(has('stone') && i===0) col='#C9BCA6';
    const w = (type==='bato'&&i>0) ? 1.98 : 1.8;
    box(tgt,col,w,.86,w,0,y+.43,0);
    const winCol = (type==='bato'&&i>0) ? '#F6EBCF' : '#FFD27A';
    [-.45,.45].forEach(x=>box(tgt,winCol,.32,.3,.04,x,y+.52,w/2+.02,{emissive:.35,outline:false}));
    if(i===0) box(tgt,'#6E4D3E',.34,.55,.04,0,y+.28,w/2+.025,{outline:false});
    if(has('brace')){ const L=Math.hypot(1.7,.8), ang=Math.atan2(.8,1.7);
      [-1,1].forEach(sd=>{ box(tgt,'#E0A84E',.05,.07,L,sd*(w/2+.035),y+.43,0,{rx:ang,outline:false}); box(tgt,'#E0A84E',.05,.07,L,sd*(w/2+.035),y+.43,0,{rx:-ang,outline:false}); }); }
    if(has('columns')) [[-.86,-.86],[.86,-.86],[-.86,.86],[.86,.86]].forEach(([x,z])=>box(tgt,'#8E949B',.22,.9,.22,x,y+.45,z));
  }
  const topY = base + (fl+s.storeys)*H;
  if(has('posts')) [[-.97,-.97],[.97,-.97],[-.97,.97],[.97,.97]].forEach(([x,z])=>box(lower,'#5A3E2B',.13,topY-base,.13,x,base+(topY-base)/2,z));
  const roofSpec = {nipa:['#C9A35C',1.1],tile:['#C0533F',.8],gi:['#8FA3B5',.55]}[s.roof];
  const rad = type==='bato' ? 1.6 : 1.45;
  const cone = new THREE.ConeGeometry(rad,roofSpec[1],4,1);
  const rm = new THREE.Mesh(cone,tmat(roofSpec[0])); rm.rotation.y=Math.PI/4; rm.position.y=topY+roofSpec[1]/2; rm.castShadow=true; roof.add(rm);
  const rol = new THREE.Mesh(cone,outlineMat); rol.rotation.y=Math.PI/4; rol.position.copy(rm.position); rol.scale.setScalar(1.05); roof.add(rol);
  if(has('straps')) [Math.PI/4,-Math.PI/4].forEach(ry=>box(roof,'#2F2A2A',2.3,.05,.08,0,topY+.06,0,{ry,outline:false}));
  return {g,lower,upper,roof,s,base:g.position.clone()};
}

// A see-through copy of the current house follows the hovered tile (3D island or panel grid).
const ghostMat = new THREE.MeshBasicMaterial({color:'#FFFFFF',transparent:true,opacity:.18,depthWrite:false});
const ghostLineMat = new THREE.LineBasicMaterial({color:'#FFFFFF',transparent:true,opacity:.95,depthWrite:false});
const unitEdges = new THREE.EdgesGeometry(unitBox);
const ghostPlate = new THREE.Mesh(new THREE.PlaneGeometry(1.96,1.96).rotateX(-Math.PI/2),
  new THREE.MeshBasicMaterial({color:'#FFFFFF',transparent:true,opacity:.5,depthWrite:false}));
ghostPlate.renderOrder = 4; ghostPlate.visible = false; world.add(ghostPlate);
let ghost = null, ghostKey = '';
const anchorFor = (c,r)=> ({ax:Math.min(3,c), ar:Math.min(3,r)});
function clearGhost(){
  ghostKey = ''; ghostPlate.visible = false;
  if(ghost){ world.remove(ghost); disposeGroup(ghost); ghost = null; }
  panel.querySelectorAll('.lot button.pv').forEach(b=>b.classList.remove('pv'));
}
function previewAt(c,r){
  if(phase!=='build' || c==null){ clearGhost(); return; }
  const pi = active, p = G.picks[pi], a = anchorFor(c,r);
  if(p.anchor && p.anchor.ax===a.ax && p.anchor.ar===a.ar){ clearGhost(); return; }
  const key = pi+':'+a.ax+','+a.ar+':'+p.type+':'+[...p.retro].join();
  if(key===ghostKey) return;
  clearGhost(); ghostKey = key;
  ghostPlate.material.color.set(TEAM[pi]);
  ghostPlate.position.set((lotX(pi,a.ax)+lotX(pi,a.ax+1))/2, .51, (lotZ(a.ar)+lotZ(a.ar+1))/2);
  ghostPlate.visible = true;
  if(p.type){
    ghostMat.color.set(TEAM[pi]); ghostLineMat.color.set(TEAM[pi]);
    ghost = makeHouse(pi,p,a).g;
    const meshes = []; ghost.traverse(o=>{ if(o.isMesh) meshes.push(o); });
    // light team-colored tint plus crisp edges on the main parts, so the shape reads clearly
    meshes.forEach(o=>{
      if(o.material===outlineMat){ o.visible = false; return; }
      o.material = ghostMat; o.castShadow = false; o.receiveShadow = false; o.renderOrder = 4;
      const isBox = o.geometry===unitBox;
      if(isBox && Math.min(o.scale.x,o.scale.y,o.scale.z) < .06) return;   // skip windows, door, straps
      const e = new THREE.LineSegments(isBox ? unitEdges : new THREE.EdgesGeometry(o.geometry), ghostLineMat);
      e.position.copy(o.position); e.rotation.copy(o.rotation); e.scale.copy(o.scale); e.renderOrder = 5;
      o.parent.add(e);
    });
    world.add(ghost);
  }
  const fp = fpTiles(a).map(t=>t.join(','));
  panel.querySelectorAll('.lot button').forEach(b=>{ if(fp.includes(b.dataset.c+','+b.dataset.r)) b.classList.add('pv'); });
}
function placeAt(c,r){
  G.picks[active].anchor = anchorFor(c,r);
  clearGhost(); buildHouse(active); renderBuild();
}
// pointer on the 3D island: hover previews, click or tap places
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function tileAt(e){
  const rect = canvas.getBoundingClientRect();
  ndc.set((e.clientX-rect.left)/rect.width*2-1, -(e.clientY-rect.top)/rect.height*2+1);
  ray.setFromCamera(ndc,camera);
  const hit = ray.intersectObjects(tiles[active].flat(),false)[0];
  return hit ? hit.object.userData : null;
}
const downs = new Map(); let multiTouch = false;
canvas.addEventListener('pointerdown',e=>{
  downs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(downs.size>1) multiTouch = true;   // two-finger pan or pinch, not a tap
});
canvas.addEventListener('pointermove',e=>{
  if(phase!=='build' || e.pointerType==='touch') return;
  if(e.buttons){ clearGhost(); return; }   // dragging the camera
  const t = tileAt(e); previewAt(t ? t.c : null, t ? t.r : null);
});
canvas.addEventListener('pointerleave',()=>{ if(phase==='build') clearGhost(); });
const pointerEnd = e=>{
  const d = downs.get(e.pointerId); downs.delete(e.pointerId);
  const wasMulti = multiTouch; if(!downs.size) multiTouch = false;
  if(e.type!=='pointerup' || phase!=='build' || !d || wasMulti || e.button!==0 || e.ctrlKey || e.metaKey || e.shiftKey) return;
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)>6) return;   // the camera was dragged
  const t = tileAt(e); if(t) placeAt(t.c,t.r);
};

  endAt = performance.now() + (online ? buildDeadline() - SingkaNet.serverTime() : BUILD_SECONDS*1000);
  clearInterval(timerId);
  const tickTimer = ()=>{
    const left = Math.max(0,(endAt-performance.now())/1000);
    timerEl.textContent = Math.ceil(left);
    timerEl.classList.toggle('low',left<=10);
    if(left<=0) lockIn();
  };
  // draw the timer before showing it, so the previous round's number never flashes
  tickTimer();
  if(phase!=='build') return;   // time had already run out, so the tick locked in
  timerEl.style.display='block';
  timerId = setInterval(tickTimer,200);
  renderBuild(); panel.classList.add('on'); panel.scrollTop=0; updateView();
  updateOppChip();
}
function bars(v){ let h='<div class="bar">'; for(let i=1;i<=5;i++) h+='<i class="'+(v>=i-.25?'on':'')+'"></i>'; return h+'</div>'; }

function lockIn(){
  if(phase!=='build') return;
  clearInterval(timerId); timerEl.style.display='none'; clearGhost();
  const p = G.picks[active];
  p.left = Math.max(0,Math.floor((endAt-performance.now())/1000));
  if(!p.type){ p.type='chb'; p.auto=true; }
  if(!p.anchor){ p.anchor={ax:1,ar:1}; p.auto=true; }
  while(spent(p)>BUDGET){ const last=[...p.retro].pop(); p.retro.delete(last); }
  buildHouse(active);
  panel.classList.remove('on');
  if(online) sendLockIn(p);
  else if(active===0) passScreen(); else runDisaster();
}

/* ---------------- Disaster sequence ---------------- */
let anim = null, anim_lowTiles = [[],[]];
function runDisaster(){
  phase='disaster'; hideOverlay(); panel.classList.remove('on'); updateView();
  G.result = evaluate();
  [0,1].forEach(pi=>{ buildHouse(pi); if(houses[pi]) houses[pi].g.visible=true; });
  setSky('storm');
  const slots = []; let si=0;
  G.result.forEach(res=>res.evacOK.forEach((ok,i)=>{ if(ok) slots.push({pi:res.pi,i,slot:si++}); }));
  [0,1].forEach(pi=>people[pi].forEach((m,i)=>{ if(!slots.find(s=>s.pi===pi&&s.i===i)) m.visible=false; }));
  slots.forEach(s=>{ const m=people[s.pi][s.i]; m.userData.from=m.position.clone(); m.userData.to=new THREE.Vector3(SLOT_POS[s.slot][0],.05,SLOT_POS[s.slot][1]); });
  document.getElementById('calloutBig').textContent = HZ[G.hz].call;
  document.getElementById('calloutSub').textContent = actualLine();
  callout.classList.add('on');
  rain.visible = G.hz!=='lindol';
  resetWater();
  if(G.hz!=='lindol') lowWater.forEach(m=>{ if(m) m.visible=true; });
  anim = {t0:performance.now(), dur:6000, slots};
}
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}
function stepAnim(now){
  const t = (now-anim.t0)/1000, D = anim.dur/1000;
  if(t>1.4) callout.classList.remove('on');
  anim.slots.forEach(s=>{ const m=people[s.pi][s.i]; const k=ease(Math.min(1,Math.max(0,(t-.2)/1.4))); m.position.lerpVectors(m.userData.from,m.userData.to,k); m.position.y += Math.abs(Math.sin(t*14))*.06*(k<1?1:0); });
  const hz = G.hz;
  if(hz==='lindol'){
    const amp = reduceMotion ? 0 : (t>.5&&t<4.5 ? .16*{6:.6,7:.8,8:1,9:1.25}[G.actual]*(1-(t-.5)/4) : 0);
    world.position.set((Math.random()-.5)*amp,(Math.random()-.5)*amp*.3,(Math.random()-.5)*amp);
  } else world.position.set(0,0,0);
  if(hz!=='lindol'){
    const arr = rainGeo.attributes.position.array;
    for(let i=0;i<RAIN_N;i++){ let y=arr[i*6+1]-.32; if(y<-.5) y+=9; arr[i*6+1]=y; arr[i*6+4]=y-.5; arr[i*6]=arr[i*6+3]+.15; }
    rainGeo.attributes.position.needsUpdate=true;
  }
  G.result.forEach(res=>{
    const H = houses[res.pi]; if(!H) return;
    const a = res.anim, k = ease(Math.min(1,Math.max(0,(t-1.4)/2)));
    const dir = res.pi===0 ? -1 : 1;
    if(hz==='lindol'){
      H.g.position.y = H.base.y - (a.sink? .38*k : 0);
      H.g.rotation.z = dir*((a.sink? .14 : 0) + a.tilt)*k;
      if(a.full){ H.g.scale.y = 1 - .62*k; H.roof.rotation.z = dir*.5*k; }
      if(a.upper){ H.upper.position.set(dir*1.1*k,-.9*k,0); H.upper.rotation.z = dir*1.1*k; H.roof.position.set(dir*1.6*k,-1.3*k,0); H.roof.rotation.z = dir*1.4*k; }
    } else {
      const kw = ease(Math.min(1,Math.max(0,(t-1)/2.4)));
      if(hz==='baha'){
        sea.position.y = currentLoc.waterY + (.5 + G.actual*.9 - currentLoc.waterY)*kw;
        const hgt = (G.actual+1)*.9*kw;
        if(lowWater[res.pi]) lowWater[res.pi].scale.y = Math.max(.01,hgt);
      } else {
        sea.position.y = currentLoc.waterY + (.42 - currentLoc.waterY)*kw;
        const hgt = .9*kw;
        if(lowWater[res.pi]) lowWater[res.pi].scale.y = Math.max(.01,hgt);
      }
      if(hz==='bagyo'){
        H.g.rotation.z = reduceMotion?0:Math.sin(t*9+res.pi)*.025*(t<5?1:0);
        if(a.roofLost){ const kr = ease(Math.min(1,Math.max(0,(t-2)/1.8))); H.roof.position.set(dir*5*kr,3.5*kr,-1*kr); H.roof.rotation.set(1.4*kr,0,dir*2*kr); H.roof.visible = kr<.98; }
      }
    }
  });
  if(t>=D){ anim=null; world.position.set(0,0,0); rain.visible=false; setSky('after'); showResults(); }
}

function showResults(){
  phase='results';
  const R = G.result;

  h += '<p class="sub" style="text-align:center;margin-top:6px">Rounds won: '+esc(pname(0))+', '+G.wins[0]+'. '+esc(pname(1))+', '+G.wins[1]+'.</p>';

  panel.innerHTML = h; panel.classList.add('on'); panel.scrollTop=0; updateView();
  if(online && !last) updateNextCue();
  const nb = panel.querySelector('[data-act="next"]');
  nb.addEventListener('click',()=>{
    if(last) finalScreen();
    else if(online){
      nb.disabled = true; nb.textContent = 'Waiting for '+pname(1-online.me)+'…';
      netCall('start_round',{p_room:online.room.id,p_round:G.round+1});
    }

function finalScreen(){

let online = null;   // {room, uid, me, names, unwatch, poll, revealing}
let countdownId = null;
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function updateLobby(){
  const r = online.room, me = online.me, opp = 1-me;
  const ready = [r.ready0, r.ready1], joined = [true, !!r.guest];
  const list = document.getElementById('lobbyPlayers'); if(!list) return;
  list.innerHTML = [0,1].map(pi=>
    '<li class="'+(ready[pi]?'is-ready':'')+'"><span class="dot" style="background:'+TEAM[pi]+'"></span>'+
    '<span class="pn">'+(joined[pi] ? esc(pname(pi)) : 'Waiting for a player to join…')+'</span>'+
    (joined[pi] ? '<span class="st">'+(ready[pi] ? 'Ready ✓' : 'Not ready')+'</span>' : '')+'</li>'
  ).join('');
  const cue = document.getElementById('lobbyCue'), btn = document.getElementById('readyBtn');
  let msg = '', nudge = false;
  if(ready[me]) msg = joined[opp] ? 'Waiting for '+esc(pname(opp))+' to ready up…' : 'You’re ready. The match starts when your opponent joins and readies up.';
  else if(joined[opp] && ready[opp]){ msg = '<b>'+esc(pname(opp))+' is ready.</b> Press Ready to start!'; nudge = true; }
  else msg = 'Set your name, then press Ready.';
  cue.innerHTML = msg; cue.classList.toggle('on', nudge);
  btn.textContent = ready[me] ? 'Not ready' : 'Ready';
  btn.className = 'btn ' + (ready[me] ? 'ghost' : (me===0?'p1':'p2')) + (nudge ? ' pulse' : '');
  btn.disabled = false;
  document.getElementById('nameIn').disabled = ready[me];
}
async function toggleReady(){
  const btn = document.getElementById('readyBtn'); btn.disabled = true;
  const wasReady = online.me===0 ? online.room.ready0 : online.room.ready1;
  try{
    // save the name first so the opponent sees it as soon as the ready flag arrives
    if(!wasReady) await saveName(document.getElementById('nameIn').value);
    syncOnline(await SingkaNet.rpc('set_ready',{p_room:online.room.id, p_ready:!wasReady}));
  }catch(e){ netError(e); }
}
function copyLink(b){
  const link = joinLink(online.room.code);
  (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
    .then(()=>{ b.textContent='Invite link copied'; })
    .catch(()=>{ b.textContent=link; });
}
function saveName(v){
  v = v.trim().slice(0,24);
  if(!v || !online || online.names[online.uid]===v) return Promise.resolve();
  online.names[online.uid] = v;
  updateLobby();
  return SingkaNet.setName(v).catch(()=>{});
}

async function pollRoom(){
  if(!online) return;
  try{
    let r = await SingkaNet.getRoom(online.room.id);
    // the opponent went quiet after the timer ran out: end the round without them
    if(phase==='waiting' && r.status==='build' && SingkaNet.serverTime() > buildDeadline()+20000)
      r = await SingkaNet.rpc('claim_timeout',{p_room:r.id,p_round:r.round});
    syncOnline(r);
  }catch(e){ /* try again on the next poll */ }
}
const STATUS_ORDER = {lobby:0, build:1, reveal:2, closed:3};
// true if r is older than what we already have (a slow poll answering after a newer update)
function staleRoom(r,cur){
  if(r.version!=null && cur.version!=null) return r.version < cur.version;
  return r.round < cur.round || (r.round===cur.round && STATUS_ORDER[r.status] < STATUS_ORDER[cur.status]);
}
function syncOnline(r){
  if(!online || !r || r.id!==online.room.id || staleRoom(r,online.room)) return;
  const prev = online.room, guestChanged = r.guest!==prev.guest;
  online.room = r;
  if(r.status==='closed'){
    if(phase==='final' || (phase==='results' && matchOver())) return;
    stopRoom(); haltPlay();
    showOverlay('<h2>The room was closed</h2><p class="lede">Your opponent left the match.</p><div style="height:16px"></div><button class="btn" data-act="leave">Back to the title screen</button>');
    return;
  }
  if(phase==='lobby'){
    if(r.status==='build') refreshNames().then(()=>{ if(online && phase==='lobby'){ newMatch(r.seed); babalaScreen(); } });
    else if(guestChanged) refreshNames().then(()=>{ if(online && phase==='lobby') renderLobby(); });
    else if(r.ready0!==prev.ready0 || r.ready1!==prev.ready1) refreshNames().then(()=>{ if(online && phase==='lobby') updateLobby(); });
    return;
  }
  if(phase==='results' && r.status==='build' && r.round===G.round+1){ G.round=r.round; setupRound(); babalaScreen(); return; }
  if(phase==='results'){ updateNextCue(); return; }
  if(phase==='build'){ updateOppChip(); return; }
  if(phase==='waiting' && r.status==='reveal' && r.round===G.round) reveal();
}
const oppFlag = key=> online.room[key+(1-online.me)];
const myFlag = key=> online.room[key+online.me];
// between rounds: nudge the player who hasn't pressed Next round yet
function updateNextCue(){
  const cue = document.getElementById('nextCue'), nb = panel.querySelector('[data-act="next"]');
  if(!online || !cue || !nb || matchOver()) return;
  const nudge = oppFlag('ready') && !myFlag('ready');
  cue.innerHTML = nudge ? '<b>'+esc(pname(1-online.me))+' is ready</b> for the next round.' : '';
  cue.classList.toggle('on',nudge); nb.classList.toggle('pulse',nudge);
}
// during building: show whether the opponent has locked in (they get first pick of evacuation spaces)
function updateOppChip(){
  const chip = document.getElementById('oppChip');
  if(!online || phase!=='build'){ chip.className = 'opp'; chip.textContent = ''; return; }
  const opp = 1-online.me, locked = !!oppFlag('locked');
  if(chip.dataset.state===(locked?'locked':'building') && chip.classList.contains('on')) return;
  chip.dataset.state = locked ? 'locked' : 'building';
  chip.className = 'opp on' + (locked ? ' locked' : '');
  chip.innerHTML = '<span class="dot" style="background:'+TEAM[opp]+'"></span><span><b>'+esc(pname(opp))+'</b> '+
    (locked ? 'locked in ✓' + (G.hz!=='lindol' ? '<small>First pick of evacuation spaces</small>' : '') : 'is building…')+'</span>';
}
function startCountdown(){
  clearInterval(countdownId);
  const step = ()=>{
    if(!online || phase!=='babala'){ clearInterval(countdownId); return; }
    const ms = Date.parse(online.room.build_start) - SingkaNet.serverTime();
    if(ms<=0){ clearInterval(countdownId); startBuild(online.me); return; }
    const b = document.getElementById('startIn');
    if(b) b.textContent = 'Building starts in '+Math.ceil(ms/1000);
  };
  countdownId = setInterval(step,200); step();
}
function sendLockIn(p){
  phase='waiting'; updateOppChip();
  showOverlay('<h2>Locked in</h2><p class="lede">Waiting for '+esc(pname(1-online.me))+' to lock in…</p><div style="height:16px"></div><button class="btn ghost" data-act="leave">Leave match</button>');
  const pick = {type:p.type, anchor:p.anchor, retro:[...p.retro], actions:p.actions, auto:!!p.auto};
  // if this fails (e.g. the round already timed out), the next poll picks up the room state
  SingkaNet.rpc('lock_in',{p_room:online.room.id,p_round:G.round,p_pick:pick}).then(syncOnline).catch(pollRoom);
}
// Builds come from the other device, so check everything against the rules before using it.
function pickFrom(raw,lockedAt,buildStart){
  raw = raw && typeof raw==='object' ? raw : {};
  const p = blankPick();
  p.auto = !!raw.auto;
  if(TEMPLATES.hasOwnProperty(raw.type)) p.type = raw.type; else { p.type='chb'; p.auto=true; }
  const a = raw.anchor || {};
  if([a.ax,a.ar].every(v=>Number.isInteger(v) && v>=0 && v<=3)) p.anchor = {ax:a.ax, ar:a.ar};
  else { p.anchor = {ax:1, ar:1}; p.auto=true; }
  (Array.isArray(raw.retro) ? raw.retro : []).forEach(id=>{ const r=RETRO.find(x=>x.id===id); if(r && retroAllowed(r,p.type)) p.retro.add(id); });
  while(spent(p)>BUDGET){ const last=[...p.retro].pop(); p.retro.delete(last); }
  const acts = Array.isArray(raw.actions) ? raw.actions : [];
  p.actions = [0,1,2].map(i=>ACTIONS.some(([id])=>id===acts[i]) ? acts[i] : 'dch');
  p.lockT = Date.parse(lockedAt);
  p.left = Math.max(0,Math.min(BUILD_SECONDS,Math.floor(BUILD_SECONDS-(p.lockT-Date.parse(buildStart))/1000)));
  return p;
}
async function reveal(){
  if(online.revealing) return;
  online.revealing = true;
  try{
    const rows = await SingkaNet.rpc('get_picks',{p_room:online.room.id,p_round:G.round});
    if(!online) return;
    online.revealing = false;
    if(!rows || rows.length<2 || phase!=='waiting') return;
    rows.forEach(row=>{ G.picks[row.player] = pickFrom(row.pick,row.locked_at,row.build_start); });
    runDisaster();
  }catch(e){ if(online) online.revealing = false; }
}
function stopRoom(){
  if(!online) return;
  online.unwatch(); clearInterval(online.poll); clearInterval(countdownId);
  online = null;
}
function leaveRoom(){
  if(!online) return;
  const id = online.room.id;
  stopRoom();
  SingkaNet.rpc('leave_room',{p_room:id}).catch(()=>{});
}

/* ---------------- View sizing ---------------- */
function updateView(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.fov = w<h ? 58 : 36;
  if(panel.classList.contains('on')){
    if(w>820) camera.setViewOffset(w,h,(390+24)/2,0,w,h);
    else camera.setViewOffset(w,h,0,Math.min(panel.offsetHeight,h*.56)/2,w,h);
  } else camera.clearViewOffset();
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',updateView);

const intro = document.getElementById('intro');
let fly = null;
function setGameCam(){ camera.position.set(0,12.5,16.5); controls.target.set(0,-.4,-1.1); controls.update(); }
function startFly(done){
  document.getElementById('introRound').textContent = 'Round '+(G.round+1)+' of 3';
  document.getElementById('introName').textContent = currentLoc.name;
  document.getElementById('introSub').textContent = currentLoc.sub;
  hideOverlay(); panel.classList.remove('on'); updateView();
  if(reduceMotion){ setGameCam(); done(); return; }
  const v = a=>new THREE.Vector3(a[0],a[1],a[2]);
  fly = {pc:new THREE.CatmullRomCurve3(currentLoc.fly.map(v)), lc:new THREE.CatmullRomCurve3(currentLoc.look.map(v)), elapsed:0, last:null, dur:5600, done};
  controls.enabled = false; intro.classList.add('on'); intro.focus({preventScroll:true});
}
function endFly(){
  if(!fly) return;
  const d = fly.done; fly = null;
  intro.classList.remove('on'); controls.enabled = true; setGameCam(); d();
}
intro.addEventListener('click',endFly);
canvas.addEventListener('pointerdown',()=>{ if(fly) endFly(); });
window.addEventListener('keydown',e=>{ if(fly && (e.key===' '||e.key==='Enter'||e.key==='Escape')){ e.preventDefault(); endFly(); } });
function tick(now){
  if(anim) stepAnim(now);
  if(fly){
    if(fly.last!==null) fly.elapsed += Math.min(50, now-fly.last);
    fly.last = now;
    const t = Math.min(1,fly.elapsed/fly.dur), e = ease(t);
    camera.position.copy(fly.pc.getPointAt(e)); camera.lookAt(fly.lc.getPointAt(e));
    if(t>=1) endFly();
  } else { controls.update(); clampPan(); }
  if(!anim && currentLoc && currentLoc.kind==='beach' && sea.visible && phase!=='results') sea.position.y = currentLoc.waterY + Math.sin(now/900)*.06;
  if(sea.visible) waveSea(now/1000, (anim && G.hz!=='lindol') || phase==='results' ? .45 : .14);
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}
newMatch(12345); buildLandscape('baha'); paintTerrain(); setGameCam();
updateView(); titleScreen(); requestAnimationFrame(tick);
// a scanned QR code opens ?room=CODE: join straight away
const roomParam = new URLSearchParams(location.search).get('room');
if(roomParam && window.SingkaNet && SingkaNet.enabled) joinRoom(roomParam);
})();
</script>
